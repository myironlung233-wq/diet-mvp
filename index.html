<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="每日饮食记录与评价建议——本地存储、无需登录的纯网页应用">
  <title>每日饮食记录</title>
  <style>
    /* ============ 基础变量与重置 ============ */
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --primary: #2f9e63;
      --primary-soft: #e6f4ec;
      --text: #1f2d27;
      --muted: #7a8a82;
      --line: #e4ebe6;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(31, 45, 39, .07), 0 4px 14px rgba(31, 45, 39, .05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px;
    }
    button { font: inherit; cursor: pointer; }
    input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--primary); }

    /* ============ 布局 ============ */
    .app-main { max-width: 860px; margin: 0 auto; padding: 12px 14px 90px; display: flex; flex-direction: column; gap: 12px; }
    .app-header {
      background: linear-gradient(135deg, #2f9e63, #3cb371);
      color: #fff; padding: 20px 16px 22px; text-align: center;
    }
    .app-header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .app-header p { font-size: 12px; opacity: .85; margin-top: 2px; }
    .footer {
      max-width: 860px; margin: 4px auto 100px; padding: 0 16px;
      font-size: 11px; color: var(--muted); text-align: center;
    }
    .footer a { margin-left: 6px; }

    /* ============ 底部导航 ============ */
    .tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      display: flex; background: #fff; border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -2px 10px rgba(31,45,39,.05);
    }
    .tab {
      flex: 1; background: none; border: none; padding: 8px 0 10px;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      font-size: 11px; color: var(--muted);
    }
    .tab span { font-size: 18px; }
    .tab.active { color: var(--primary); font-weight: 600; }

    /* ============ 卡片 ============ */
    .card {
      background: var(--card); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow);
    }
    .card h3 { font-size: 15px; margin-bottom: 10px; }
    .card h4.sub { font-size: 13px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; }

    /* ============ 表单 ============ */
    .input {
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
      background: #fbfcfb; font-size: 14px; min-width: 0;
    }
    .input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
    textarea.input { width: 100%; resize: vertical; }
    .num { width: 76px; }
    .grow { flex: 1 1 140px; }
    .row { display: flex; align-items: center; }
    .row.gap { gap: 8px; margin-top: 10px; }
    .row.wrap { flex-wrap: wrap; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    label.small { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
    label.block { width: 100%; margin-top: 10px; }
    label.check { display: flex; align-items: center; gap: 5px; font-size: 13px; border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
    label.check:has(input:checked) { background: var(--primary-soft); border-color: var(--primary); }
    .small-inputs label { flex-direction: column; font-size: 11px; color: var(--muted); }

    /* ============ 按钮 ============ */
    .btn {
      border: 1px solid transparent; border-radius: 10px; padding: 8px 16px;
      font-size: 14px; transition: filter .15s;
    }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.ghost { background: #fff; border-color: var(--line); color: var(--text); }
    .btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
    .btn:hover { filter: brightness(1.05); }
    .danger-text { color: var(--danger); }

    /* ============ 今日摘要 ============ */
    .day-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 6px; text-align: center; }
    .day-summary div { background: var(--primary-soft); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; }
    .day-summary b { font-size: 18px; color: var(--primary); }
    .day-summary span { font-size: 11px; color: var(--muted); }
    .date-input { flex: 1; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .warn-text { color: var(--warn); }

    /* ============ 餐次与食物条目 ============ */
    .meal-section h3 { margin-bottom: 6px; }
    .meal-head { display: flex; justify-content: space-between; align-items: baseline; }
    .empty-tip { color: var(--muted); font-size: 13px; padding: 6px 0; }
    .item-card {
      border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
      margin-top: 8px; background: #fdfefd;
    }
    .item-card.editing { border-color: var(--primary); }
    .item-title b { font-size: 15px; }
    .kcal { white-space: nowrap; font-weight: 700; color: var(--primary); }
    .item-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
    .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #eef2ef; color: var(--muted); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .badge.danger { background: #fee2e2; color: var(--danger); }
    .badge.soft { background: var(--primary-soft); color: var(--primary); }
    .item-actions { margin-top: 8px; }

    /* ============ 评价页 ============ */
    .eval-head { display: flex; align-items: center; gap: 16px; }
    .eval-side h3 { margin-bottom: 4px; }
    .dim-row { padding: 10px 0; border-bottom: 1px dashed var(--line); }
    .dim-row:last-child { border-bottom: none; }
    .dim-head { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px; }
    .dim-score { color: var(--primary); font-weight: 700; }
    .bar { height: 8px; background: #eef2ef; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .5s ease; }
    .bar-fill.good { background: #2f9e63; }
    .bar-fill.mid { background: #d9a406; }
    .bar-fill.bad { background: #e0592a; }
    .sugg { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: #fdfefd; }
    .tag-why, .tag-how {
      display: inline-block; font-size: 11px; border-radius: 6px; padding: 0 6px;
      margin-right: 6px; vertical-align: 1px;
    }
    .tag-why { background: #eef2ef; color: var(--muted); }
    .tag-how { background: var(--primary-soft); color: var(--primary); }
    .ring text { font-family: inherit; }
    .center-empty { text-align: center; padding: 34px 16px; }
    .center-empty .btn { margin-top: 12px; }

    /* ============ 历史页图表（纯 CSS，无外部依赖） ============ */
    .chart-grid { display: grid; gap: 14px; }
    @media (min-width: 720px) { .chart-grid { grid-template-columns: 1fr 1fr; } }
    .chart { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .chart-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 104px; }
    .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; }
    .chart-bar { width: 100%; max-width: 30px; border-radius: 5px 5px 2px 2px; transition: height .4s ease; }
    .chart-val { font-size: 10px; color: var(--muted); }
    .chart-label { font-size: 10px; color: var(--muted); }
    .day-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px dashed var(--line);
    }
    .day-row:last-of-type { border-bottom: none; }
    .data-ops { border-top: 1px solid var(--line); padding-top: 12px; }

    /* ============ 轻提示 ============ */
    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px);
      background: #1f2d27; color: #fff; font-size: 13px; padding: 9px 18px;
      border-radius: 999px; z-index: 99; opacity: 0; transition: all .3s ease;
      max-width: 86vw; text-align: center; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: #b91c1c; }

    /* ============ 桌面端适配 ============ */
    @media (min-width: 720px) {
      .app-header { border-radius: 0 0 18px 18px; }
      .app-header h1 { font-size: 24px; }
      .day-summary { max-width: 560px; margin-left: auto; margin-right: auto; }
      .eval-head { gap: 24px; }
      .app-main { padding-top: 20px; gap: 14px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <noscript>本应用需要启用 JavaScript 才能运行。</noscript>
  <script src="app.js?v=2"></script>
</body>
</html>
